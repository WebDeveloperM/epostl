# /etc/nginx/sites-available/reflective_portfolio
# HTTPS: certbot --nginx -d portfolio.example.uz

upstream portfolio_app {
    server unix:/run/reflective_portfolio/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name portfolio.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portfolio.example.uz;

    ssl_certificate     /etc/letsencrypt/live/portfolio.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.example.uz/privkey.pem;

    # Katta videolar uchun (tizim sozlamalaridagi video limitidan katta bo‘lsin)
    client_max_body_size 2048m;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /var/www/reflective_portfolio/static/;
        expires 30d;
        access_log off;
    }

    # MUHIM: /media/ ochiq berilmaydi. Fayllar faqat Django ruxsat tekshirgandan
    # keyin X-Accel-Redirect orqali shu ichki location'dan uzatiladi.
    location /protected-media/ {
        internal;
        alias /var/www/reflective_portfolio/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, max-age=3600" always;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://portfolio_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
