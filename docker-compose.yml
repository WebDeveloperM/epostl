# Refleksiv portfolio platformasi
#   cp .env.docker.example .env.docker   # parollarni to‘ldiring
#   docker compose up -d --build
#   http://localhost:8080
name: reflective-portfolio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: reflective-portfolio:latest
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/var/static
      - media:/app/var/media
      - logs:/app/var/logs
      - cache:/app/var/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PORTFOLIO_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro

  scheduler:
    image: reflective-portfolio:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      SKIP_BOOTSTRAP: "1"
    command: ["/app/docker/scheduler.sh"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - logs:/app/var/logs
      - cache:/app/var/cache

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    entrypoint: ["sh", "/scripts/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups

volumes:
  pgdata:
  static:
  media:
  logs:
  cache:
