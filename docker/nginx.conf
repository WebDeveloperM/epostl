upstream portfolio_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Katta videolar (tizim sozlamalaridagi video limitidan katta bo‘lsin)
    client_max_body_size 2048m;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # /media/ ochiq berilmaydi: fayl faqat Django ruxsatni tekshirgandan keyin
    # X-Accel-Redirect orqali shu ichki location'dan uzatiladi (video uchun Range ham shu yerda).
    location /protected-media/ {
        internal;
        alias /var/www/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://portfolio_app;
        # $http_host — port bilan birga (CSRF Origin tekshiruvi uchun muhim)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
