<div class="empty-state">
  <i class="bi {{ icon|default:'bi-inbox' }}"></i>
  <div class="fw-semibold text-body">{{ title }}</div>
  {% if text %}<div class="small mt-1">{{ text }}</div>{% endif %}
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary btn-sm mt-3"><i class="bi bi-plus-lg me-1"></i>{{ action_label }}</a>{% endif %}
</div>
